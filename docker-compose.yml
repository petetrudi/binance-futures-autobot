services:
  binance-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: binance-futures-autobot
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - TRADING_MODE=${TRADING_MODE:-PAPER}
      - DASHBOARD_PIN=${DASHBOARD_PIN:-}
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
      - BINANCE_FAPI_BASE_URL=${BINANCE_FAPI_BASE_URL}
      - BINANCE_FWS_BASE_URL=${BINANCE_FWS_BASE_URL}
      - LIVE_TRADING_CONFIRMED=${LIVE_TRADING_CONFIRMED:-false}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - CRYPTOPANIC_API_KEY=${CRYPTOPANIC_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - ./data:/app/data
